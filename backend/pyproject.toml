[project]
name = "agent-town-api"
version = "0.1.0"
description = "Agent Town API: accounts, agents, MCP tools and the public district"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
